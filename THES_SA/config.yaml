project:
  name: THES_SA
  description: "Sentiment Analysis and Short-Term Return Predictability in Small-Cap Nuclear & Energy-Transition Equities"
  version: "2.0"

paths:
  root: /Users/alexandrebredillot/Documents/GitHub/FIN_PP/THES_SA
  data_dir: data
  raw: data/raw
  processed: data/processed
  news: data/news
  models: models
  results: results
  cache: cache
  notebooks: notebooks

tickers:
  core_set:
    - SMR    # NuScale Power (small modular reactors)
    - LEU    # Centrus Energy (nuclear fuel enrichment)
    - LTBR   # Lightbridge (nuclear fuel technology)
    - NXE    # NexGen Energy (uranium mining)
    - NNE    # Nano Nuclear Energy (next-gen nuclear)
    - LAC    # Lithium Americas (energy-transition minerals)
  benchmark_set:
    - CCJ    # Cameco (large-cap uranium producer)
    - CEG    # Constellation Energy (large-cap nuclear utility)
    - BWXT   # BWX Technologies (large-cap nuclear components)
  all_tickers:
    - SMR
    - LEU
    - LTBR
    - NXE
    - NNE
    - LAC
    - CCJ
    - CEG
    - BWXT

dates:
  start_date: null         # use YYYY-MM-DD or null
  end_date: null           # use YYYY-MM-DD or null
  months_back: 24          # 24-month lookback for more training data

yfinance:
  intervals:
    daily: "1d"
  period: "2y"
  auto_adjust: true
  prepost: false
  threads: true
  proxy: null

huggingface:
  dataset: "oliverwang/FNSPID"
  cache_dir: "data/hf_cache"
  use_auth_token: false
  max_articles: 10000
  text_column: "headline"
  date_column: "date"

newsapi:
  use_env: true
  api_key: ""
  url: https://newsapi.org/v2/everything
  page_size: 100
  free_plan_days: 30
  max_retries: 3
  retry_backoff_sec: 1

fetch:
  parallel_workers: 4
  sleep_between_requests_sec: 1.5
  cache_ttl_seconds: 86400

phase0:
  min_articles_per_ticker: 50
  supplement_via_scraping: true
  audit_report_path: results/feasibility_audit.yaml

sentiment:
  model: "ProsusAI/finbert"
  max_length: 512
  batch_size: 32
  aggregation: "volume_weighted"   # volume-weighted average per ticker per day
  momentum_window: 3               # 3-day rolling change for Sentiment Momentum
  output_scored: "data/processed/news_scored.csv"
  output_merged: "data/processed/merged_dataset.csv"

model:
  target_columns:
    - Forward_Return_1d
    - Forward_Return_5d
  forecast_horizons:
    - 1
    - 5
  test_size: 0.2
  random_state: 42

lstm:
  sequence_length: 15        # shorter window — more sequences from limited data
  hidden_size: 128           # larger hidden state for richer representations
  num_layers: 2
  dropout: 0.3               # stronger regularization with more capacity
  epochs: 200                # more epochs — early stopping controls overfitting
  batch_size: 16             # smaller batches for better gradient signal
  learning_rate: 0.0005      # slower learning rate with larger model
  early_stopping_patience: 15
  validation_split: 0.1

thresholds:
  sentiment_positive: 0.05
  sentiment_negative: -0.05
  min_articles_per_day: 1

cache:
  enabled: true
  dir: cache
  ttl_seconds: 86400

logging:
  level: INFO
  logfile: fetch.log

environment:
  NEWSAPI_ENV_VAR: NEWSAPI_KEY

kaggle:
  fnspid_dataset_slug: "elsabetyemane/financial-news-and-stock-price-integration-dataset"
  fnspid_input_path: "/kaggle/input/financial-news-and-stock-price-integration-dataset"
  code_dataset_slug: "alexandrebredillot/thes-sa-code"
  code_input_path: "/kaggle/input/thes-sa-code"
  working_dir: "/kaggle/working"

notes:
  - "v2.0: Revised per advisor feedback (Feb 2026). Daily frequency only."
  - "Core Set = small-cap nuclear/energy-transition. Benchmark Set = large-cap nuclear/energy."
  - "Phase 0 feasibility audit must pass before running full pipeline."
  - "Replace API key placeholders or set the indicated environment variables."
  - "For Kaggle: run setup_kaggle.sh to upload code dataset + push kernel."
